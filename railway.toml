[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# $PORT раскрывается только через shell — иначе Railway передаёт буквально "$PORT"
# startCommand пустой — используется scripts/entrypoint.sh (RUN_MODE=web по умолчанию)
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
