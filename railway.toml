[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# $PORT раскрывается только через shell — иначе Railway передаёт буквально "$PORT"
startCommand = "/bin/sh -c \"uvicorn src.api.app:app --host 0.0.0.0 --port $PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
